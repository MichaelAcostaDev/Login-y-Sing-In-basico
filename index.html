<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="/bootstrap-5.2.3-dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(#667eea 0%, #764ba2 100%);">
    <div class="container mx-auto border-0 rounded-3 shadow-lg d-flex flex-column bg-white card-body p-5" style="max-width: 500px;">
        <h2 class="text-center mb-4">Login</h2>
        <form>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Contrasena</label>
                <input type="password" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <a class="text-decoration-none" href="/singIn.html">No tienes una cuenta? Crea una</a>
    </div>
</body>

</html>
